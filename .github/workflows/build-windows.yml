name: Build Windows Executable and Installer

on:
  push:
    branches: [ main, feature/v3.0.0 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        python -m PyInstaller --clean --noconfirm --onedir --windowed `
          --name VideoToText `
          --collect-all tkinterdnd2 `
          --hidden-import=tqdm `
          --hidden-import=pkg_resources.extern `
          --exclude-module pandas `
          --exclude-module openpyxl `
          --exclude-module tensorboard `
          --exclude-module tensorflow `
          --exclude-module matplotlib `
          video_to_text.py

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Build Installer
      run: |
        # Run Inno Setup compiler (iscc) on our script
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

    - name: Compress Portable ZIP
      shell: powershell
      run: |
        Compress-Archive -Path "dist\VideoToText\*" -DestinationPath "VideoToText-Portable.zip"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: VideoToText-v3.0.0-Build
        path: |
          VideoToText-Portable.zip
          installer/Output/VideoToText-Setup.exe