name: Build Windows Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to manually trigger the build from the Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Download and Extract FFmpeg
      shell: powershell
      run: |
        Write-Host "Downloading FFmpeg..."
        Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
        Write-Host "Extracting FFmpeg..."
        Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_temp"
        
        # Find ffmpeg.exe inside the nested folders and move it to the root directory
        $ffmpegExe = Get-ChildItem -Path "ffmpeg_temp" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
        Move-Item -Path $ffmpegExe.FullName -Destination ".\ffmpeg.exe"
        Write-Host "FFmpeg ready."

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        python -m PyInstaller --clean --noconfirm --onedir --windowed `
          --name VideoToText `
          --add-binary "ffmpeg.exe;." `
          --collect-all tkinterdnd2 `
          --collect-data whisper `
          --hidden-import=tqdm `
          --hidden-import=pkg_resources.extern `
          --exclude-module pandas `
          --exclude-module openpyxl `
          --exclude-module tensorboard `
          --exclude-module tensorflow `
          --exclude-module matplotlib `
          video_to_text.py

    - name: Compress Build into ZIP
      shell: powershell
      run: |
        Compress-Archive -Path "dist\VideoToText\*" -DestinationPath "VideoToText-Windows.zip"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VideoToText-Windows-Build
        path: VideoToText-Windows.zip